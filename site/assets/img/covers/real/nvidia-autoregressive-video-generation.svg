<svg class="svgt" viewBox="0 0 900 430" role="img" aria-labelledby="fig1-title fig1-desc" xmlns="http://www.w3.org/2000/svg"><style>.svgt{font-family:-apple-system,BlinkMacSystemFont,segoe ui,Arial,sans-serif}
.svg-h{fill:#111827;font-size:22px;font-weight:800}
.svg-sub{fill:#475467;font-size:14px;font-weight:650}
.svg-label{fill:#111827;font-size:13px;font-weight:760}
.svg-small{fill:#667085;font-size:12px;font-weight:560}
.panel{fill:#fbfcfa;stroke:#dce4d4;stroke-width:1.5}
.box-green{fill:#76b900}
.box-soft{fill:#eaf6da;stroke:#76b900;stroke-width:1.5}
.box-blue{fill:#eaf1ff;stroke:#2563eb;stroke-width:1.5}
.line-green{fill:none;stroke:#76b900;stroke-width:2.3}
.line-blue{fill:none;stroke:#2563eb;stroke-width:2.5}</style><rect width="900" height="430" fill="#ffffff"/><title id="fig1-title">Full-sequence diffusion compared with AR diffusion</title><desc id="fig1-desc">Full diffusion repeatedly updates an entire bidirectional clip. AR diffusion emits blocks sequentially and reuses a bounded KV cache.</desc><defs><marker id="arrow1" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0 7 3.5.0 7z" fill="#76b900"/></marker></defs><rect x="20" y="20" width="410" height="385" rx="18" class="panel"/><rect x="470" y="20" width="410" height="385" rx="18" class="panel"/><text x="45" y="58" class="svg-h">Full-sequence diffusion</text><text x="495" y="58" class="svg-h">AR diffusion</text><text x="45" y="84" class="svg-sub">Bidirectional clip, repeated global updates</text><text x="495" y="84" class="svg-sub">AR blocks, streaming updates</text><g transform="translate(48 118)"><g><rect x="0" y="0" width="48" height="88" rx="7" class="box-blue"/><rect x="58" y="0" width="48" height="88" rx="7" class="box-blue"/><rect x="116" y="0" width="48" height="88" rx="7" class="box-blue"/><rect x="174" y="0" width="48" height="88" rx="7" class="box-blue"/><rect x="232" y="0" width="48" height="88" rx="7" class="box-blue"/><rect x="290" y="0" width="48" height="88" rx="7" class="box-blue"/></g><path d="M24 104c0 41 290 41 290 0" class="line-blue"/><path d="M82 104c0 28 174 28 174 0" class="line-blue"/><path d="M140 104c0 16 58 16 58 0" class="line-blue"/><text x="169" y="170" text-anchor="middle" class="svg-label">Every step revisits every frame</text><rect x="18" y="195" width="300" height="24" rx="12" fill="#dce9ff"/><rect x="18" y="195" width="155" height="24" rx="12" fill="#2563eb"/><text x="169" y="248" text-anchor="middle" class="svg-small">No frame is final until the clip is final</text></g><g transform="translate(496 118)"><rect x="0" y="0" width="86" height="88" rx="8" class="box-green"/><rect x="102" y="0" width="86" height="88" rx="8" class="box-soft"/><rect x="204" y="0" width="86" height="88" rx="8" class="box-soft"/><rect x="306" y="0" width="54" height="88" rx="8" fill="#f0f2f5" stroke="#cfd4dc"/><text x="43" y="50" text-anchor="middle" class="svg-white">emit</text><text x="145" y="50" text-anchor="middle" class="svg-label">denoise</text><text x="247" y="50" text-anchor="middle" class="svg-label">next</text><text x="333" y="50" text-anchor="middle" class="svg-small">…</text><rect x="-4" y="-5" width="192" height="98" rx="12" fill="none" stroke="#76b900" stroke-width="3"/><path d="M43 108v37H145V112" class="line-green" marker-end="url(#arrow1)"/><rect x="0" y="172" width="360" height="58" rx="10" fill="#111827"/><text x="18" y="197" class="svg-white">rolling KV cache</text><g transform="translate(18 207)"><rect x="0" y="0" width="40" height="12" rx="3" fill="#76b900"/><rect x="48" y="0" width="40" height="12" rx="3" fill="#76b900" opacity=".82"/><rect x="96" y="0" width="40" height="12" rx="3" fill="#76b900" opacity=".66"/><rect x="144" y="0" width="40" height="12" rx="3" fill="#76b900" opacity=".5"/><rect x="192" y="0" width="40" height="12" rx="3" fill="#76b900" opacity=".34"/></g><text x="180" y="258" text-anchor="middle" class="svg-small">Bounded state; output appears block by block</text></g></svg>